<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- ewe-sync — the app icon: the ewe fleece mark on the family's rounded square -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fbce0"/>
      <stop offset="1" stop-color="#3d6d99"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#g)"/>
  <g fill="#ffffff">
    <!-- fleece: overlapping circles -->
    <circle cx="24" cy="30" r="9"/>
    <circle cx="33" cy="26" r="9.5"/>
    <circle cx="42" cy="31" r="8.5"/>
    <circle cx="28" cy="38" r="8.5"/>
    <circle cx="38" cy="39" r="8.5"/>
    <!-- head -->
    <circle cx="48" cy="38" r="5.5"/>
    <!-- legs -->
    <rect x="26" y="44" width="3.2" height="9" rx="1.6"/>
    <rect x="37" y="44" width="3.2" height="9" rx="1.6"/>
  </g>
  <!-- eye -->
  <circle cx="49.5" cy="37" r="1.2" fill="#3d6d99"/>
</svg>
