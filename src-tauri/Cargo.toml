[package]
name = "ewe-sync"
version = "0.17.2-beta"
description = "ewe Sync — the ewe account app: your settings, folders and computers"
authors = ["scubba"]
license = "MIT"
edition = "2021"

[lib]
name = "ewe_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"  # the avatar as a data: URL (cloud_avatar; already in the lock via tauri)
sha2 = "0.10"   # the machine id (machines/<id>.json) — same derivation as ewe-remote
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# Open/Save through the portal, so ewe's file picker draws it (ewe RFC-011);
# the default "gtk3" feature drew GTK's dialog inside this app instead
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }       # the folder picker (Choose… on the Folders pane)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
notify = "7"                    # inotify for the "on change" folder trigger
toml = "0.8"                    # reads the account's copy of ewe.conf for the restore preview
# the platform webview at close time (tray.rs: the web process is ended with
# the page, or WebKit caches it page-less for 30 min); the version and feature
# Tauri itself pins, nothing new in the lock
webkit2gtk = { version = "2.0", features = ["v2_40"] }

# Everything ewe-sync does is the user's own: it drives the ewe tools (ewe-cloud,
# ewe-conf, ewe-auth) as argv, talks WebDAV with the account's app password,
# and pokes the shell over `qs ipc`. No privileged helper, no shell strings.

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
