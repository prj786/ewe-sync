[package]
name = "ewe-sync"
version = "0.15.1-beta"
description = "ewe-sync — the ewe account app: the one file, your machines, your folders"
authors = ["scubba"]
license = "MIT"
edition = "2021"

[lib]
name = "ewe_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sha2 = "0.10"   # the machine id (machines/<id>.json) — same derivation as ewe-remote
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"       # the folder picker (Choose… on the Folders pane)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
notify = "7"                    # inotify for the "on change" folder trigger
toml = "0.8"                    # reads the account's copy of ewe.conf for the restore preview

# Everything ewe-sync does is the user's own: it drives the ewe tools (ewe-cloud,
# ewe-conf, ewe-auth) as argv, talks WebDAV with the account's app password,
# and pokes the shell over `qs ipc`. No privileged helper, no shell strings.

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
